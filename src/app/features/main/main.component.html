@if (isMobile()) {
  <app-mobile-main></app-mobile-main>
} @else {
<div class="dashboard-layout">

  <!-- Columna izquierda: editor, registros y eventos -->
  <div class="col-left">
    <div class="cell cell-editor">
      <app-editor></app-editor>
    </div>
    <div class="cell cell-registers">
      <app-registers-view></app-registers-view>
    </div>
    <div class="cell cell-events">
      <app-event-view></app-event-view>
    </div>
  </div>

  <!-- Stats: fila superior, columnas 2 y 3 -->
  <div class="cell-stats">
    @if (isSuperscalar) {
      <app-superscalar-stats-view></app-superscalar-stats-view>
    } @else {
      <app-stats-view></app-stats-view>
    }
  </div>

  <!-- Columna central: Pipeline y Timeline y las vistas del superescalar -->
  <div class="col-center">
    <div class="cell cell-pipeline">
      @if (isSuperscalar) {
        <app-superscalar-pipeline-view></app-superscalar-pipeline-view>
      } @else {
        <app-pipeline-view></app-pipeline-view>
      }
    </div>

    <div class="cell cell-timeline">
      <app-timeline-view></app-timeline-view>
    </div>

    @if (isSuperscalar) {
      <!-- Vistas específicas del procesador superescalar -->
      <div class="superscalar-grid">
        <div class="cell cell-rs">
          <app-rs-view></app-rs-view>
        </div>
        <div class="cell cell-cdb">
          <app-cdb-view></app-cdb-view>
        </div>
        <div class="cell cell-rob">
          <app-rob-view></app-rob-view>
        </div>
      </div>
    }
  </div>

  <!-- Columna derecha: Consola y memoria -->
  <div class="col-right">
    <div class="cell cell-console">
      <app-console-view></app-console-view>
    </div>
    <div class="cell cell-memory">
      <app-memory-view-group [memories]="memories"></app-memory-view-group>
    </div>
  </div>

</div>
}
